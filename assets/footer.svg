<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="ft">
<title id="ft">Thanks for dropping by!</title>
<defs>
<style>
@font-face{font-family:'FPSans';font-weight:100 900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
