.f0{stroke-dasharray:26 1246;stroke-dashoffset:1246;animation:f0k 5.5s linear 0.0s infinite;}@keyframes f0k{from{stroke-dashoffset:1246}to{stroke-dashoffset:-1220}}.f1{stroke-dasharray:26 1246;stroke-dashoffset:0;animation:f1k 6.5s linear 2.0s infinite;}@keyframes f1k{from{stroke-dashoffset:0}to{stroke-dashoffset:1246}}.f2{stroke-dasharray:26 1246;stroke-dashoffset:0;animation:f2k 6.0s linear 1.0s infinite;}@keyframes f2k{from{stroke-dashoffset:0}to{stroke-dashoffset:1246}}.f3{stroke-dasharray:26 1246;stroke-dashoffset:1246;animation:f3k 7.0s linear 3.0s infinite;}@keyframes f3k{from{stroke-dashoffset:1246}to{stroke-dashoffset:-1220}}.f4{stroke-dasharray:26 362;stroke-dashoffset:362;animation:f4k 3.0s linear 0.5s infinite;}@keyframes f4k{from{stroke-dashoffset:362}to{stroke-dashoffset:-336}}.f5{stroke-dasharray:26 332;stroke-dashoffset:332;animation:f5k 3.4s linear 1.6s infinite;}@keyframes f5k{from{stroke-dashoffset:332}to{stroke-dashoffset:-306}}.f6{stroke-dasharray:26 362;stroke-dashoffset:362;animation:f6k 3.2s linear 1.1s infinite;}@keyframes f6k{from{stroke-dashoffset:362}to{stroke-dashoffset:-336}}.f7{stroke-dasharray:26 332;stroke-dashoffset:332;animation:f7k 3.6s linear 2.4s infinite;}@keyframes f7k{from{stroke-dashoffset:332}to{stroke-dashoffset:-306}}
