<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
<title id="t">Quotes by Alexander Supertramp, Into the Wild</title>
<desc id="d">When you want something in life, you just gotta reach out and grab it. / The core of man’s spirit comes from new experiences. / Happiness only real when shared.</desc>
