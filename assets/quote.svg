<g class="q q0" style="animation-delay:0s"><text x="120" y="104" class="serif" font-size="34.0" fill="#E6EDF3">When you want something in life, you just gotta</text><text x="120" y="150" class="serif" font-size="34.0" fill="#E6EDF3">reach out and grab it.</text></g><g class="q q1" style="animation-delay:7s"><text x="120" y="128" class="serif" font-size="34.0" fill="#E6EDF3">The core of man’s spirit comes from new experiences.</text></g><g class="q q2" style="animation-delay:14s"><text x="120" y="128" class="serif" font-size="34.0" fill="#E6EDF3">Happiness only real when shared.</text></g>
